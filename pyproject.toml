[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aou-phenotype-enrichment"
version = "0.1.0"
description = "Gene-specific expression-underlier phenotype enrichment in All of Us"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0,<4", "numpy>=1.24,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
workbench = ["google-cloud-bigquery>=3.20,<4", "db-dtypes>=1.2,<2", "pyarrow>=14", "nbformat>=5.9"]
reference = ["openpyxl>=3.1,<4"]

[project.scripts]
aou-enrichment = "aou_enrichment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
